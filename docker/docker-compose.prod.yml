# Produccion: TODO en Docker. Un solo `docker compose -f docker/docker-compose.prod.yml up -d`.
name: cod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/widget/dist:/srv/widget:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [admin, api]

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile.api, target: prod }
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    env_file: [../.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/Dockerfile.api, target: prod }
    restart: unless-stopped
    env_file: [../.env]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  admin:
    build: { context: .., dockerfile: docker/Dockerfile.admin, target: prod }
    restart: unless-stopped
    env_file: [../.env]
    expose: ["3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: docker/Dockerfile.worker, target: prod }
    restart: unless-stopped
    env_file: [../.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [../.env]
    volumes: ["./backup.sh:/backup.sh:ro", "backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
