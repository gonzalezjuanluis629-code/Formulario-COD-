# Sube a Shopify la configuración de la app y la extensión del tema
# (el bloque «Formulario COD» con el widget). Railway NO hace esta parte:
# el código del bloque vive dentro de Shopify.
#
# Requiere el secreto SHOPIFY_SERVICE_ACCOUNT_TOKEN: token de una cuenta de servicio
# con permiso «App development» para esta app (Dev Dashboard → app cod-forms → Settings →
# App CLI automation token → Manage).
name: Shopify app deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/extensions/**'
      - 'apps/admin/shopify.app.toml'
      - '.github/workflows/shopify-deploy.yml'
  workflow_dispatch:

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Comprobar el token
        id: token
        run: |
          if [ -z "$SHOPIFY_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::warning::Falta el secreto SHOPIFY_SERVICE_ACCOUNT_TOKEN; no se sube nada a Shopify."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        if: steps.token.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Instalar Shopify CLI
        if: steps.token.outputs.ok == 'true'
        run: npm install -g @shopify/cli@latest

      - name: Subir app y extensión a Shopify
        if: steps.token.outputs.ok == 'true'
        working-directory: apps/admin
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: shopify app deploy --config shopify.app.toml --allow-updates --source-control-url "$COMMIT_URL"
