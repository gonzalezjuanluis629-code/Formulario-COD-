# Sube a Shopify la configuración de la app y la extensión del tema
# (el bloque «Formulario COD» con el widget). Railway NO hace esta parte:
# el código del bloque vive dentro de Shopify.
#
# Requiere el secreto SHOPIFY_CLI_PARTNERS_TOKEN (Shopify Partners → token de CLI).
name: Shopify app deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/extensions/**'
      - 'apps/admin/shopify.app.toml'
      - '.github/workflows/shopify-deploy.yml'
  workflow_dispatch:

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
    steps:
      - name: Comprobar el token
        id: token
        run: |
          if [ -z "$SHOPIFY_CLI_PARTNERS_TOKEN" ]; then
            echo "::warning::Falta el secreto SHOPIFY_CLI_PARTNERS_TOKEN; no se sube nada a Shopify."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Subir app y extensión a Shopify
        if: steps.token.outputs.ok == 'true'
        working-directory: apps/admin
        run: npx --yes @shopify/cli@3 app deploy --force --config shopify.app.toml
