# Camino A: UNA custom app por tienda. Este archivo se duplica por tienda
# cambiando client_id y application_url. El backend es el mismo para todas.
client_id = "ff96db52ce043d910bb3e194da76b0ce"
name = "COD Forms"
handle = "cod-forms-4"
application_url = "https://admin-production-d33e.up.railway.app/app"
embedded = true

[access_scopes]
# Mínimo indispensable. Pedir de más retrasa la aprobación de Protected Customer Data.
scopes = "write_orders,read_orders,read_products,read_customers,write_customers,read_discounts"

[auth]
redirect_urls = [ "https://admin-production-d33e.up.railway.app/auth/callback" ]

# El widget se sirve por aquí. Shopify firma cada request con HMAC.
[app_proxy]
url = "https://api-production-e421.up.railway.app"
subpath = "cod"
prefix = "apps"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "orders/cancelled" ]
  uri = "https://api-production-e421.up.railway.app/webhooks"

  # Obligatorios para Protected Customer Data.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://api-production-e421.up.railway.app/webhooks"

[build]
automatically_update_urls_on_dev = false
